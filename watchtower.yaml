# WatchTower 配置文件
# 将此文件放置于项目根目录。所有字段均有默认值，可按需修改。

server:
  ingest_port: 9090       # 摄入 API 与探针 API 的监听端口
  dashboard_port: 8080    # 仪表板 Web UI 的监听端口

agent:
  enabled: true           # 是否启用系统指标采集代理
  interval_seconds: 5     # 指标采集间隔（秒）

retention:
  metrics_hours: 1        # 时序数据在内存中的保留时长（小时）
  logs_hours: 24          # 日志数据在内存中的保留时长（小时）

# HTTP 端点探针列表：WatchTower 会按照 interval_seconds 周期性探测这些端点
endpoints:
  - name: watchtower-self
    url: http://localhost:9090/api/v1/metrics
    method: GET
    expected_status: 405    # GET /metrics 只允许 POST，返回 405 表示服务正常
    interval_seconds: 30
    timeout_ms: 5000

  - name: google-dns
    url: https://dns.google
    method: GET
    expected_status: 200
    interval_seconds: 60
    timeout_ms: 10000

# 预定义告警规则（启动时自动加载，等同于通过 API 创建）
alerts:
  - name: high_cpu
    wql_expression: avg(cpu_usage_percent[5m])
    operator: ">"
    threshold: 85
    duration: 5m
    severity: warning

  - name: high_memory
    wql_expression: avg(memory_usage_percent[5m])
    operator: ">"
    threshold: 90
    duration: 5m
    severity: critical

# 通知渠道（可选）：告警触发/恢复时向指定渠道发送通知
# severities 为空表示接收所有级别；支持的类型：console、webhook、slack、discord、email
# notifications:
#   channels:
#     - type: console                      # 打印到终端，适合开发调试
#     - type: webhook
#       url: https://hooks.example.com/alert
#       severities: [critical, warning]
#     - type: slack
#       url: https://hooks.slack.com/services/T00/B00/xxx
#       severities: [critical]
#     - type: discord
#       url: https://discord.com/api/webhooks/xxx/yyy
#     - type: email
#       smtp_host: smtp.example.com
#       smtp_port: 587
#       from: alerts@example.com
#       to: [oncall@example.com]
#       smtp_username: alerts@example.com
#       smtp_password: secret

# API 密钥（可选）：取消注释后，所有 /api/ 端点将要求有效密钥
# 密钥可通过 POST /api/v1/auth/keys 动态创建（需要 admin 权限）
# api_keys:
#   - name: admin-key
#     key: "changeme-use-a-random-64-char-hex-string"
#     permissions: [admin]
#   - name: readonly
#     key: "another-secret-key"
#     permissions: [read]
