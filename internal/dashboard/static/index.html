<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WatchTower — 监控平台</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ── 全局样式 ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #30363d;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --accent:    #58a6ff;
      --green:     #3fb950;
      --yellow:    #d29922;
      --red:       #f85149;
      --purple:    #bc8cff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
    }

    /* ── 顶栏 ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .logo {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--accent);
    }
    header .logo span { color: var(--text); }
    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red);
      margin-left: auto;
      transition: background 0.3s;
    }
    #status-dot.connected { background: var(--green); }
    #status-text { font-size: 0.8rem; color: var(--muted); }

    /* ── 标签导航 ── */
    .tab-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      gap: 0;
    }
    .tab-btn {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 12px 20px;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── 标签面板 ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── 指标标签布局 ── */
    #tab-metrics {
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
      gap: 20px;
    }

    /* ── 告警标签布局 ── */
    #tab-alerts {
      padding: 24px;
    }

    /* ── 日志标签布局 ── */
    #tab-logs {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── 面板卡片 ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .panel-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .panel-title {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .panel-value {
      font-size: 2.4rem;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .panel-unit {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 400;
    }
    .chart-wrap {
      position: relative;
      height: 160px;
      margin-top: 4px;
    }

    /* ── 颜色主题 ── */
    .cpu    .panel-value { color: var(--accent); }
    .ram    .panel-value { color: var(--green); }
    .disk   .panel-value { color: var(--yellow); }
    .custom .panel-value { color: var(--purple); }

    /* ── 告警面板 ── */
    .alert-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }
    .alert-panel .panel-title {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .alert-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      align-items: center;
    }
    #create-alert-btn {
      background: var(--green);
      color: #0d1117;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: opacity 0.15s;
    }
    #create-alert-btn:hover { opacity: 0.85; }

    /* 告警徽章 */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .badge-critical { background: rgba(248,81,73,0.2);  color: var(--red);    border: 1px solid rgba(248,81,73,0.4); }
    .badge-warning  { background: rgba(210,153,34,0.2); color: var(--yellow); border: 1px solid rgba(210,153,34,0.4); }
    .badge-info     { background: rgba(88,166,255,0.2); color: var(--accent); border: 1px solid rgba(88,166,255,0.4); }
    .badge-pending  { background: rgba(139,148,158,0.2);color: var(--muted);  border: 1px solid rgba(139,148,158,0.4); }
    .badge-resolved { background: rgba(63,185,80,0.2);  color: var(--green);  border: 1px solid rgba(63,185,80,0.4); }

    #active-alerts-list { margin-bottom: 16px; min-height: 32px; }
    #active-alerts-list .no-alerts { color: var(--muted); font-size: 0.85rem; }

    /* 告警历史时间线 */
    .history-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    #alert-history-list {
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
    }
    .history-item:last-child { border-bottom: none; }
    .history-time { color: var(--muted); white-space: nowrap; min-width: 80px; }
    .history-name { font-weight: 600; }
    .history-msg  { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 创建告警模态框 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: min(500px, 95vw);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal h2 { font-size: 1.1rem; font-weight: 700; }
    .form-row { display: flex; flex-direction: column; gap: 4px; }
    .form-row label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
    .form-row input, .form-row select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }
    .form-row input:focus, .form-row select:focus { border-color: var(--accent); }
    .form-row-inline { display: flex; gap: 8px; }
    .form-row-inline .form-row { flex: 1; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .btn-primary {
      background: var(--accent); color: #0d1117; border: none;
      border-radius: 6px; padding: 8px 18px; font-weight: 600; cursor: pointer;
    }
    .btn-secondary {
      background: transparent; color: var(--muted); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 18px; font-weight: 600; cursor: pointer;
    }
    #modal-error { color: var(--red); font-size: 0.82rem; display: none; }

    /* ── WQL 查询面板 ── */
    .query-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      grid-column: 1 / -1;
    }
    .query-panel .panel-title {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .query-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    #wql-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-family: "Fira Code", "Consolas", monospace;
      font-size: 0.9rem;
      outline: none;
    }
    #wql-input:focus { border-color: var(--accent); }
    #wql-btn {
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: opacity 0.15s;
    }
    #wql-btn:hover { opacity: 0.85; }
    #wql-result {
      font-size: 0.88rem;
      min-height: 40px;
    }
    #wql-result .result-scalar {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
    }
    #wql-result .result-bool-true  { color: var(--green); font-weight: 600; font-size: 1.2rem; }
    #wql-result .result-bool-false { color: var(--red);   font-weight: 600; font-size: 1.2rem; }
    #wql-result .result-error { color: var(--red); }
    #wql-result table {
      border-collapse: collapse;
      width: 100%;
    }
    #wql-result th, #wql-result td {
      text-align: left;
      padding: 6px 12px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
    }
    #wql-result th { color: var(--muted); font-weight: 600; background: var(--bg); }

    /* ── 日志面板 ── */
    .log-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }
    .log-panel .panel-title {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .log-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      align-items: center;
    }
    #log-search {
      flex: 1;
      min-width: 200px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 12px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }
    #log-search:focus { border-color: var(--accent); }
    #log-search::placeholder { color: var(--muted); }
    #log-level-filter {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    #log-level-filter:focus { border-color: var(--accent); }
    #log-count {
      font-size: 0.8rem;
      color: var(--muted);
      margin-left: auto;
    }

    /* 日志表格 */
    .log-table-wrap {
      max-height: 480px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .log-table-wrap::-webkit-scrollbar { width: 6px; }
    .log-table-wrap::-webkit-scrollbar-track { background: var(--bg); }
    .log-table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    #log-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
      font-family: "Fira Code", "Consolas", monospace;
    }
    #log-table thead th {
      background: var(--bg);
      color: var(--muted);
      font-weight: 600;
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1;
    }
    #log-table tbody tr {
      border-bottom: 1px solid rgba(48,54,61,0.5);
      transition: background 0.1s;
    }
    #log-table tbody tr:hover { background: rgba(48,54,61,0.4); }
    #log-table tbody tr:last-child { border-bottom: none; }
    #log-table td {
      padding: 7px 12px;
      vertical-align: top;
    }
    .log-time  { color: var(--muted); white-space: nowrap; min-width: 90px; }
    .log-src   { color: var(--purple); white-space: nowrap; }
    .log-msg   { word-break: break-word; }

    /* 日志级别徽章 */
    .log-badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .log-error { background: rgba(248,81,73,0.2);  color: var(--red);    border: 1px solid rgba(248,81,73,0.4); }
    .log-warn  { background: rgba(210,153,34,0.2); color: var(--yellow); border: 1px solid rgba(210,153,34,0.4); }
    .log-info  { background: rgba(88,166,255,0.2); color: var(--accent); border: 1px solid rgba(88,166,255,0.4); }
    .log-debug { background: rgba(139,148,158,0.1);color: var(--muted);  border: 1px solid rgba(139,148,158,0.3); }

    #log-empty {
      text-align: center;
      padding: 40px 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* ── 端点监控面板 ── */
    #tab-uptime { padding: 24px; }
    .probe-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }
    .probe-panel-title {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .probe-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      align-items: center;
    }
    #add-probe-btn {
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: opacity 0.15s;
    }
    #add-probe-btn:hover { opacity: 0.85; }
    #probe-refresh-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: color 0.15s;
    }
    #probe-refresh-btn:hover { color: var(--text); }

    /* 探针卡片 */
    .probe-list { display: flex; flex-direction: column; gap: 12px; }
    .probe-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .probe-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 12px;
    }
    .probe-info-col { flex: 1; min-width: 0; }
    .probe-name { font-weight: 700; font-size: 0.95rem; }
    .probe-url { font-size: 0.78rem; color: var(--muted); margin-top: 2px; word-break: break-all; }
    .probe-metrics-col {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .probe-status-badge {
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.06em;
    }
    .probe-up      { background: rgba(63,185,80,0.2);  color: var(--green); border: 1px solid rgba(63,185,80,0.4); }
    .probe-down    { background: rgba(248,81,73,0.2);  color: var(--red);   border: 1px solid rgba(248,81,73,0.4); }
    .probe-unknown { background: rgba(139,148,158,0.15);color: var(--muted); border: 1px solid rgba(139,148,158,0.3); }
    .probe-rt       { font-size: 0.84rem; color: var(--text); font-variant-numeric: tabular-nums; }
    .probe-uptime-val { font-size: 0.84rem; color: var(--green); font-variant-numeric: tabular-nums; }

    /* 状态历史圆点 */
    .probe-dots {
      display: flex;
      gap: 3px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .probe-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      cursor: default;
      flex-shrink: 0;
    }
    .dot-up   { background: var(--green); }
    .dot-down { background: var(--red); }

    /* 响应时间火花图 */
    .probe-sparkline-wrap {
      height: 48px;
      position: relative;
    }

    /* 添加探针模态框 */
    #probe-modal .modal { width: min(480px, 95vw); }

    /* ── 底部 ── */
    footer {
      text-align: center;
      padding: 16px;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Watch<span>Tower</span></div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <div id="status-dot"></div>
    <div id="status-text">未连接</div>
  </div>
</header>

<!-- 标签导航栏 -->
<nav class="tab-bar">
  <button class="tab-btn active" data-tab="metrics">指标</button>
  <button class="tab-btn" data-tab="logs">日志</button>
  <button class="tab-btn" data-tab="alerts">告警</button>
  <button class="tab-btn" data-tab="uptime">端点监控</button>
</nav>

<!-- ── 指标标签 ─────────────────────────────────────────────────────────── -->
<div id="tab-metrics" class="tab-panel active">

  <!-- CPU 面板 -->
  <div class="panel cpu">
    <div class="panel-title">CPU 使用率</div>
    <div class="panel-header">
      <div class="panel-value" id="val-cpu">—</div>
      <div class="panel-unit">%</div>
    </div>
    <div class="chart-wrap"><canvas id="chart-cpu"></canvas></div>
  </div>

  <!-- 内存面板 -->
  <div class="panel ram">
    <div class="panel-title">内存使用率</div>
    <div class="panel-header">
      <div class="panel-value" id="val-ram">—</div>
      <div class="panel-unit">%</div>
    </div>
    <div class="chart-wrap"><canvas id="chart-ram"></canvas></div>
  </div>

  <!-- 磁盘面板 -->
  <div class="panel disk">
    <div class="panel-title">磁盘使用率</div>
    <div class="panel-header">
      <div class="panel-value" id="val-disk">—</div>
      <div class="panel-unit">%</div>
    </div>
    <div class="chart-wrap"><canvas id="chart-disk"></canvas></div>
  </div>

  <!-- 内存字节面板 -->
  <div class="panel custom">
    <div class="panel-title">内存已用</div>
    <div class="panel-header">
      <div class="panel-value" id="val-membytes">—</div>
      <div class="panel-unit" id="unit-membytes">GB</div>
    </div>
    <div class="chart-wrap"><canvas id="chart-membytes"></canvas></div>
  </div>

  <!-- WQL 查询面板 -->
  <div class="query-panel">
    <div class="panel-title">WQL 查询</div>
    <div class="query-row">
      <input id="wql-input" type="text"
        placeholder="avg(cpu_usage_percent[5m])"
        value="avg(cpu_usage_percent[5m])" />
      <button id="wql-btn">查询</button>
    </div>
    <div id="wql-result"><span style="color:var(--muted)">输入 WQL 表达式后点击查询</span></div>
  </div>

</div><!-- /#tab-metrics -->

<!-- ── 日志标签 ─────────────────────────────────────────────────────────── -->
<div id="tab-logs" class="tab-panel">

  <div class="log-panel">
    <div class="panel-title">
      日志查看器
      <span id="log-new-badge" style="display:none;background:var(--accent);color:#0d1117;border-radius:10px;padding:1px 8px;font-size:0.72rem"></span>
    </div>

    <!-- 搜索工具栏 -->
    <div class="log-toolbar">
      <input id="log-search" type="text" placeholder="搜索日志消息（支持 /regex/ 正则）" />
      <select id="log-level-filter">
        <option value="">全部级别</option>
        <option value="error">ERROR</option>
        <option value="warn">WARN</option>
        <option value="info">INFO</option>
        <option value="debug">DEBUG</option>
      </select>
      <span id="log-count"></span>
    </div>

    <!-- 日志表格 -->
    <div class="log-table-wrap" id="log-table-wrap">
      <table id="log-table">
        <thead>
          <tr>
            <th style="width:100px">时间</th>

<script>
// ── 通用工具 ──────────────────────────────────────────────────────────────────
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── 标签切换逻辑 ──────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');

    // 切换到日志标签时：清除新日志提示徽章，滚动到底部
    if (tab === 'logs') {
      clearLogBadge();
      scrollLogToBottom();
    }
  });
});

// ── Chart.js 通用配置 ──────────────────────────────────────────────────────────
const COLORS = {
  cpu:      { line: '#58a6ff', fill: 'rgba(88,166,255,0.15)' },
  ram:      { line: '#3fb950', fill: 'rgba(63,185,80,0.15)' },
  disk:     { line: '#d29922', fill: 'rgba(210,153,34,0.15)' },
  membytes: { line: '#bc8cff', fill: 'rgba(188,140,255,0.15)' },
};

function makeChart(canvasId, key) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  return new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        data: [],
        borderColor: COLORS[key].line,
        backgroundColor: COLORS[key].fill,
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.4,
        fill: true,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
      scales: {
        x: {
          grid: { color: '#21262d' },
          ticks: { color: '#8b949e', maxTicksLimit: 6, font: { size: 10 } },
        },
        y: {
          grid: { color: '#21262d' },
          ticks: { color: '#8b949e', font: { size: 10 } },
          min: 0,
        }
      }
    }
  });
}

const charts = {
  cpu:      makeChart('chart-cpu',      'cpu'),
  ram:      makeChart('chart-ram',      'ram'),
  disk:     makeChart('chart-disk',     'disk'),
  membytes: makeChart('chart-membytes', 'membytes'),
};

// ── 推入数据点到图表（保留最近 5 分钟 / 60 个点）───────────────────────────────
const MAX_POINTS = 60;

function pushPoint(chart, label, value) {
  chart.data.labels.push(label);
  chart.data.datasets[0].data.push(value);
  if (chart.data.labels.length > MAX_POINTS) {
    chart.data.labels.shift();
    chart.data.datasets[0].data.shift();
  }
  chart.update('none');
}

function bytesToGB(bytes) { return (bytes / 1073741824).toFixed(2); }

// ── WebSocket 连接与自动重连 ─────────────────────────────────────────────────
const dot  = document.getElementById('status-dot');
const stxt = document.getElementById('status-text');
let ws, retryDelay = 1000;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    dot.classList.add('connected');
    stxt.textContent = '已连接';
    retryDelay = 1000;
  };

  ws.onmessage = (evt) => {
    try { handleMessage(JSON.parse(evt.data)); }
    catch(e) { console.warn('消息解析失败', e); }
  };

  ws.onclose = () => {
    dot.classList.remove('connected');
    stxt.textContent = `重连中 (${retryDelay / 1000}s)…`;
    setTimeout(connect, retryDelay);
    retryDelay = Math.min(retryDelay * 2, 30000);
  };

  ws.onerror = () => ws.close();
}

connect();

// ── 处理 WebSocket 推送消息 ──────────────────────────────────────────────────
function handleMessage(data) {
  const now = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  const m = data.metrics || {};

  // 更新告警面板
  if (Array.isArray(data.alerts)) renderAlerts(data.alerts);

  // 更新日志面板
  if (Array.isArray(data.logs) && data.logs.length > 0) {
    mergeLogs(data.logs);
  }

  if (m.cpu_usage_percent !== undefined) {
    document.getElementById('val-cpu').textContent = +m.cpu_usage_percent.toFixed(1);
    pushPoint(charts.cpu, now, +m.cpu_usage_percent.toFixed(1));
  }
  if (m.memory_usage_percent !== undefined) {
    document.getElementById('val-ram').textContent = +m.memory_usage_percent.toFixed(1);
    pushPoint(charts.ram, now, +m.memory_usage_percent.toFixed(1));
  }
  if (m.disk_usage_percent !== undefined) {
    document.getElementById('val-disk').textContent = +m.disk_usage_percent.toFixed(1);
    pushPoint(charts.disk, now, +m.disk_usage_percent.toFixed(1));
  }
  if (m.memory_used_bytes !== undefined) {
    const gb = +bytesToGB(m.memory_used_bytes);
    document.getElementById('val-membytes').textContent = gb;
    pushPoint(charts.membytes, now, gb);
  }
}

// ── 告警面板逻辑 ──────────────────────────────────────────────────────────────
const ALERTS_API = 'http://localhost:9090/api/v1/alerts';

function renderAlerts(alerts) {
  const list = document.getElementById('active-alerts-list');
  const countBadge = document.getElementById('active-count');
  const firing = (alerts || []).filter(a => a.state === 'firing' || a.state === 'pending');

  if (firing.length === 0) {
    list.innerHTML = '<span class="no-alerts">暂无活跃告警</span>';
    countBadge.style.display = 'none';
  } else {
    countBadge.textContent = firing.length;
    countBadge.style.display = 'inline';
    list.innerHTML = firing.map(a => {
      const cls = a.state === 'pending' ? 'badge-pending' : `badge-${a.severity}`;
      return `<span class="badge ${cls}" style="margin:0 4px 4px 0">
        ${escapeHtml(a.name)} — ${escapeHtml(a.severity.toUpperCase())} — ${(+a.value).toFixed(2)}
      </span>`;
    }).join('');
  }
}

async function fetchAlertHistory() {
  try {
    const resp = await fetch(`${ALERTS_API}/history`);
    const history = await resp.json();
    const container = document.getElementById('alert-history-list');
    if (!Array.isArray(history) || history.length === 0) {
      container.innerHTML = '<div style="color:var(--muted);font-size:0.82rem">暂无历史记录</div>';
      return;
    }
    container.innerHTML = history.slice(0, 20).map(ev => {
      const cls = ev.state === 'firing' ? 'badge-critical'
               : ev.state === 'resolved' ? 'badge-resolved'
               : ev.state === 'pending'  ? 'badge-pending'
               : '';
      const t = new Date(ev.timestamp).toLocaleTimeString('zh-CN', {hour12:false});
      return `<div class="history-item">
        <span class="history-time">${t}</span>
        <span class="badge ${cls}" style="font-size:0.72rem;padding:2px 7px">${escapeHtml(ev.state)}</span>
        <span class="history-name">${escapeHtml(ev.rule_name)}</span>
        <span class="history-msg">${escapeHtml(ev.message||'')}</span>
      </div>`;
    }).join('');
  } catch(e) { /* 告警服务可能尚未启动 */ }
}

document.getElementById('create-alert-btn').addEventListener('click', () => {
  document.getElementById('alert-modal').classList.add('open');
  document.getElementById('modal-error').style.display = 'none';
});
document.getElementById('modal-cancel').addEventListener('click', () => {
  document.getElementById('alert-modal').classList.remove('open');
});
document.getElementById('alert-modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('alert-modal'))
    document.getElementById('alert-modal').classList.remove('open');

document.getElementById('modal-submit').addEventListener('click', async () => {
  const errEl = document.getElementById('modal-error');
  errEl.style.display = 'none';
  const rule = {
    name:           document.getElementById('f-name').value.trim(),
    wql_expression: document.getElementById('f-expr').value.trim(),
    operator:       document.getElementById('f-op').value,
    threshold:      parseFloat(document.getElementById('f-threshold').value),
    duration:       document.getElementById('f-duration').value.trim() || '0',
    severity:       document.getElementById('f-severity').value,
    webhook_url:    document.getElementById('f-webhook').value.trim(),
  };
  try {
    const resp = await fetch(`${ALERTS_API}/rules`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(rule),
    });
    const data = await resp.json();
    if (!resp.ok) {
      errEl.textContent = data.error || '创建失败';
      errEl.style.display = 'block';
      return;
    }
    document.getElementById('alert-modal').classList.remove('open');
    fetchAlertHistory();
  } catch(e) {
    errEl.textContent = '网络错误: ' + String(e);

fetchAlertHistory();
setInterval(fetchAlertHistory, 15000);

// ── 日志面板逻辑 ──────────────────────────────────────────────────────────────

// allLogs 存储所有已接收的日志（按时间升序，最新在末尾）
let allLogs = [];
// lastLogTs 是已渲染日志的最大时间戳，用于去重
let lastLogTs = 0;

// mergeLogs 将服务器推送的日志合并到本地列表（去重 + 限制上限）
function mergeLogs(incoming) {
  // incoming 已是升序（最旧在前）
  let hasNew = false;
  for (const e of incoming) {
    if (e.timestamp > lastLogTs) {
      allLogs.push(e);
      lastLogTs = e.timestamp;
      hasNew = true;
    }
  }
  if (!hasNew) return;

  // 保留最近 2000 条
  if (allLogs.length > 2000) allLogs = allLogs.slice(allLogs.length - 2000);

  // 若日志标签不是当前活跃标签，显示新日志提示
  const logsTab = document.getElementById('tab-logs');
  if (!logsTab.classList.contains('active')) {
    showLogBadge(allLogs.length);
  }

  renderLogTable();
}

// renderLogTable 根据当前搜索/过滤条件渲染日志表格
function renderLogTable() {
  const q     = document.getElementById('log-search').value.toLowerCase();
  const level = document.getElementById('log-level-filter').value;

  // 过滤（展示时最新在底部：allLogs 已是升序）
  let filtered = allLogs;
  if (q) {
    filtered = filtered.filter(e => e.message.toLowerCase().includes(q));
  }
  if (level) {
    filtered = filtered.filter(e => e.level === level);
  }

  const tbody = document.getElementById('log-tbody');
  document.getElementById('log-count').textContent = `共 ${filtered.length} 条`;

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" id="log-empty">' +
      (allLogs.length === 0 ? '暂无日志数据' : '无匹配结果') + '</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(e => {
    const t = new Date(e.timestamp).toLocaleTimeString('zh-CN', {hour12:false});
    const lvl = (e.level || 'info').toLowerCase();
    const badgeCls = lvl === 'error' ? 'log-error'
                   : lvl === 'warn'  ? 'log-warn'
                   : lvl === 'debug' ? 'log-debug'
                   : 'log-info';
    return `<tr>
      <td class="log-time">${t}</td>
      <td><span class="log-badge ${badgeCls}">${escapeHtml(lvl)}</span></td>
      <td class="log-src">${escapeHtml(e.source || '')}</td>
      <td class="log-msg">${escapeHtml(e.message || '')}</td>
    </tr>`;
  }).join('');

  // 自动滚动到最新日志（底部）
  scrollLogToBottom();
}

function scrollLogToBottom() {
  const wrap = document.getElementById('log-table-wrap');
  if (wrap) wrap.scrollTop = wrap.scrollHeight;
}

function showLogBadge(count) {
  const badge = document.getElementById('log-new-badge');
  badge.textContent = `${count}`;
  badge.style.display = 'inline';
}

function clearLogBadge() {
  const badge = document.getElementById('log-new-badge');
  badge.style.display = 'none';
}

// 搜索/过滤实时响应
document.getElementById('log-search').addEventListener('input', renderLogTable);
document.getElementById('log-level-filter').addEventListener('change', renderLogTable);

// ── WQL 查询功能 ──────────────────────────────────────────────────────────────
const wqlInput  = document.getElementById('wql-input');
const wqlBtn    = document.getElementById('wql-btn');
const wqlResult = document.getElementById('wql-result');
const QUERY_URL = 'http://localhost:9090/api/v1/query';

async function runQuery() {
  const q = wqlInput.value.trim();
  if (!q) return;
  wqlResult.innerHTML = '<span style="color:var(--muted)">查询中…</span>';
  try {
    const resp = await fetch(`${QUERY_URL}?q=${encodeURIComponent(q)}`);
    const data = await resp.json();
    if (data.error) {
      wqlResult.innerHTML = `<span class="result-error">错误: ${escapeHtml(data.error)}</span>`;
      return;
    }
    renderResult(data);
  } catch(e) {
    wqlResult.innerHTML = `<span class="result-error">请求失败: ${escapeHtml(String(e))}</span>`;
  }
}

function renderResult(data) {
  if (data.type === 'scalar' && data.scalar !== null && data.scalar !== undefined) {
    wqlResult.innerHTML = `<div class="result-scalar">${(+data.scalar).toFixed(4)}</div>`;
  } else if (data.type === 'bool' && data.bool !== null) {
    const cls = data.bool ? 'result-bool-true' : 'result-bool-false';
    wqlResult.innerHTML = `<div class="${cls}">${data.bool ? '✓ true' : '✗ false'}</div>`;
  } else if (data.type === 'vector' && Array.isArray(data.vector)) {
    if (data.vector.length === 0) {
      wqlResult.innerHTML = '<span style="color:var(--muted)">结果为空</span>';
      return;
    }
    const keys = [...new Set(data.vector.flatMap(s => Object.keys(s.labels || {})))].sort();
    let html = '<table><thead><tr>';
    keys.forEach(k => { html += `<th>${escapeHtml(k)}</th>`; });
    html += '<th>值</th></tr></thead><tbody>';
    data.vector.forEach(s => {
      html += '<tr>';
      keys.forEach(k => { html += `<td>${escapeHtml(s.labels?.[k] ?? '')}</td>`; });
      html += `<td>${(+s.value).toFixed(4)}</td></tr>`;
    });
    html += '</tbody></table>';
    wqlResult.innerHTML = html;
  } else {
    wqlResult.innerHTML = `<pre style="color:var(--muted);font-size:0.8rem">${escapeHtml(JSON.stringify(data, null, 2))}</pre>`;
  }
}

wqlBtn.addEventListener('click', runQuery);
wqlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') runQuery(); });

// ── 端点监控逻辑 ──────────────────────────────────────────────────────────────
const PROBES_API = 'http://localhost:9090/api/v1/probes';

// sparklineCharts 保存每个探针的 Chart.js 实例（防止重复创建）
const sparklineCharts = {};

// fetchProbes 拉取探针列表并渲染卡片
async function fetchProbes() {
  try {
    const resp = await fetch(PROBES_API);
    if (!resp.ok) return;
    const probes = await resp.json();
    renderProbeList(probes || []);
  } catch(e) {
    // 探针 API 可能暂未初始化，静默忽略
  }
}

// renderProbeList 渲染/更新所有探针卡片
function renderProbeList(probes) {
  const container = document.getElementById('probe-list');
  const emptyEl   = document.getElementById('probe-empty');

  if (!probes || probes.length === 0) {
    if (emptyEl) emptyEl.style.display = 'block';
    return;
  }
  if (emptyEl) emptyEl.style.display = 'none';

  // 更新摘要（up/total）
  const upCount = probes.filter(p => p.status === 'up').length;
  const summary = document.getElementById('probe-summary');
  if (summary) summary.textContent = `${upCount} / ${probes.length} 在线`;

  // 已存在的卡片名称集合
  const existingNames = new Set(
    [...container.querySelectorAll('.probe-card')].map(c => c.dataset.name)
  );
  const incomingNames = new Set(probes.map(p => p.name));

  // 移除已删除探针的卡片
  existingNames.forEach(name => {
    if (!incomingNames.has(name)) {
      document.getElementById('probe-card-' + name)?.remove();
      if (sparklineCharts[name]) {
        sparklineCharts[name].destroy();
        delete sparklineCharts[name];
      }
    }
  });

  // 创建或更新卡片
  probes.forEach(probe => {
    if (!document.getElementById('probe-card-' + probe.name)) {
      const card = document.createElement('div');
      card.className = 'probe-card';
      card.id = 'probe-card-' + probe.name;
      card.dataset.name = probe.name;
      card.innerHTML = probeCardTemplate(probe.name, probe.url, probe.method);
      container.appendChild(card);
    }
    updateProbeCardData(probe);
  });
}

// probeCardTemplate 生成探针卡片的静态 HTML 骨架（动态数据通过 updateProbeCardData 填充）
function probeCardTemplate(name, url, method) {
  const safeId = escapeHtml(name);
  return `
    <div class="probe-card-top">
      <div class="probe-info-col">
        <div class="probe-name">${escapeHtml(name)}</div>
        <div class="probe-url">${escapeHtml(method || 'GET')} ${escapeHtml(url)}</div>
      </div>
      <div class="probe-metrics-col">
        <span class="probe-status-badge probe-unknown" id="pbadge-${safeId}">?</span>
        <span class="probe-rt" id="prt-${safeId}">—</span>
        <span class="probe-uptime-val" id="puptime-${safeId}">—</span>
      </div>
    </div>
    <div class="probe-dots" id="pdots-${safeId}"></div>
    <div class="probe-sparkline-wrap">
      <canvas id="sparkline-${safeId}"></canvas>
    </div>`;
}

// updateProbeCardData 更新探针卡片的动态内容（状态、响应时间、圆点、火花图）
function updateProbeCardData(probe) {
  const id = probe.name;
  const badge   = document.getElementById('pbadge-'   + id);
  const rtEl    = document.getElementById('prt-'      + id);
  const uptimeEl= document.getElementById('puptime-'  + id);
  const dotsEl  = document.getElementById('pdots-'    + id);

  // 状态徽章
  if (badge) {
    const st = probe.status || 'unknown';
    badge.textContent = st === 'up' ? 'UP' : st === 'down' ? 'DOWN' : '?';
    badge.className = 'probe-status-badge probe-' + st;
  }
  // 响应时间
  if (rtEl) {
    rtEl.textContent = probe.status === 'unknown' ? '—' : probe.response_ms + 'ms';
  }
  // 可用率
  if (uptimeEl) {
    uptimeEl.textContent = probe.status === 'unknown' ? '—'
      : (probe.uptime_pct !== undefined ? probe.uptime_pct.toFixed(1) + '%' : '—');
  }
  // 状态历史圆点（升序：最旧在左）
  if (dotsEl) {
    const hist = probe.recent_history || [];
    dotsEl.innerHTML = hist.map(r =>
      `<span class="probe-dot ${r.status === 'up' ? 'dot-up' : 'dot-down'}"
             title="${r.status} ${r.response_ms}ms"></span>`
    ).join('');
  }
  // 响应时间火花图
  updateSparkline(probe);
}

// updateSparkline 创建或更新 Chart.js 火花图
function updateSparkline(probe) {
  const canvas = document.getElementById('sparkline-' + probe.name);
  if (!canvas) return;

  const hist   = probe.recent_history || [];
  const data   = hist.map(r => r.response_ms);
  const labels = hist.map(() => '');
  const colors = hist.map(r => r.status === 'up' ? '#3fb950' : '#f85149');

  if (sparklineCharts[probe.name]) {
    const ch = sparklineCharts[probe.name];
    ch.data.labels = labels;
    ch.data.datasets[0].data = data;
    ch.data.datasets[0].pointBackgroundColor = colors;
    ch.update('none');
  } else {
    const ctx = canvas.getContext('2d');
    sparklineCharts[probe.name] = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data,
          borderColor: '#58a6ff',
          borderWidth: 1.5,
          pointRadius: hist.map(() => 3),
          pointBackgroundColor: colors,
          tension: 0.3,
          fill: false,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => `${ctx.parsed.y}ms`,
            }
          }
        },
        scales: {
          x: { display: false },
          y: { display: false, min: 0 },
        }
      }
    });
  }
}

// 添加探针模态框逻辑
document.getElementById('add-probe-btn').addEventListener('click', () => {
  document.getElementById('probe-modal').classList.add('open');
  document.getElementById('probe-modal-error').style.display = 'none';
});
document.getElementById('probe-modal-cancel').addEventListener('click', () => {
  document.getElementById('probe-modal').classList.remove('open');
});
document.getElementById('probe-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('probe-modal'))
    document.getElementById('probe-modal').classList.remove('open');
});

document.getElementById('probe-modal-submit').addEventListener('click', async () => {
  const errEl = document.getElementById('probe-modal-error');
  errEl.style.display = 'none';
  const cfg = {
    name:            document.getElementById('pf-name').value.trim(),
    url:             document.getElementById('pf-url').value.trim(),
    method:          document.getElementById('pf-method').value,
    expected_status: parseInt(document.getElementById('pf-status').value, 10),
    interval_seconds:parseInt(document.getElementById('pf-interval').value, 10),
    timeout_ms:      parseInt(document.getElementById('pf-timeout').value, 10),
  };
  try {
    const resp = await fetch(PROBES_API, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(cfg),
    });
    const data = await resp.json();
    if (!resp.ok) {
      errEl.textContent = data.error || '添加失败';
      errEl.style.display = 'block';
      return;
    }
    document.getElementById('probe-modal').classList.remove('open');
    fetchProbes();
  } catch(e) {
    errEl.textContent = '网络错误: ' + String(e);
    errEl.style.display = 'block';
  }
});

document.getElementById('probe-refresh-btn').addEventListener('click', fetchProbes);

// 切换到 Uptime 标签时刷新
document.querySelectorAll('.tab-btn').forEach(btn => {
  if (btn.dataset.tab === 'uptime') {
    btn.addEventListener('click', fetchProbes);
  }
});

// 初始加载 + 每 30 秒刷新一次
fetchProbes();
setInterval(fetchProbes, 30000);
</script>
